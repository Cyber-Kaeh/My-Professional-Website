<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- Explicit PNGs first: browsers resolve these more predictably than
         ICO, and Firefox in particular will otherwise fall back to a
         generated letter tile. favicon.ico (16/32/48) stays for older
         browsers and Windows shortcuts; apple-touch-icon is the iOS tile. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= BASE_URL %>favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= BASE_URL %>favicon-16.png"
    />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <link rel="apple-touch-icon" href="<%= BASE_URL %>apple-touch-icon.png" />
    <title>Anthony Allen — Software Engineer</title>
    <meta
      name="description"
      content="Anthony Allen — software engineer focused on DevOps, automation and open source. Projects include a self-hosted Proxmox VE server, Kasm Workspaces and Nextcloud."
    />

    <!-- Link preview cards (LinkedIn, Slack, iMessage, Discord, Facebook).
         These crawlers do not run JavaScript, and this is a SPA whose body is
         an empty <div id="app">, so these tags are the only thing they can
         read. og:url and og:image must be absolute: the crawler fetches them
         from its own servers, where a relative path resolves to nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anthony Allen" />
    <meta property="og:url" content="https://anthonyallen.dev/" />
    <meta property="og:title" content="Anthony Allen — Software Engineer" />
    <meta
      property="og:description"
      content="I build and automate things — from web apps to the servers they run on. DevOps, automation and open source."
    />
    <meta
      property="og:image"
      content="https://anthonyallen.dev/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta
      property="og:image:alt"
      content="Anthony Allen — Software Engineer, DevOps, Open Source"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anthony Allen — Software Engineer" />
    <meta
      name="twitter:description"
      content="I build and automate things — from web apps to the servers they run on."
    />
    <meta
      name="twitter:image"
      content="https://anthonyallen.dev/og-image.jpg"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <!-- Source Serif 4 carries headings and body copy; Roboto above is kept
         for UI chrome (navbar, buttons); JetBrains Mono is the hero eyebrow. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but Anthony's portfolio website doesn't work properly
        without JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
